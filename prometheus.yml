global:
  scrape_interval: 5s # Scrape every 5 seconds for near real-time metrics

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:8080']

  - job_name: 'scheduler'
    dns_sd_configs:
      - names: ['scheduler']
        type: 'A'
        port: 8080
        refresh_interval: 15s

  - job_name: 'worker'
    dns_sd_configs:
      - names: ['worker']
        type: 'A'
        port: 8080
        refresh_interval: 15s
