name: Publish Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v1.0.0, latest)'
        required: true
        default: 'latest'

jobs:
  publish:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: src/Api/Dockerfile
          - service: scheduler
            dockerfile: src/Scheduler/Dockerfile
          - service: worker
            dockerfile: src/Worker/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image tag & repository prefix
        run: |
          # 1. Lowercase repository name for GHCR compliance
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

          # 2. Determine tag from git tag or manual workflow input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV
          echo "Publishing with tag: ${TAG}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
