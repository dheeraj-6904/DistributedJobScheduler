name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore DistributedJobScheduler.sln

      - name: Build solution
        run: dotnet build DistributedJobScheduler.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test tests/UnitTests/DistributedJobScheduler.UnitTests.csproj --no-build -c Release --verbosity normal

      - name: Run integration tests
        run: dotnet test tests/IntegrationTests/DistributedJobScheduler.IntegrationTests.csproj --no-build -c Release --verbosity normal
